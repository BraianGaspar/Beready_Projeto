name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4"]

    defaults:
      run:
        working-directory: backend

    # Postgres descartável: o tests/bootstrap.php aplica as migrations e os seeds a cada execução
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beready_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      # Valores apenas de teste (não são segredos). APP_NAME definido faz o bootstrap ignorar o .env.
      - name: Run PHPUnit
        run: vendor/bin/phpunit
        env:
          APP_NAME: Beready
          APP_ENV: test
          DEBUG: false
          APP_ENCODING: UTF-8
          APP_DEFAULT_LOCALE: pt_BR
          APP_DEFAULT_TIMEZONE: America/Sao_Paulo
          APP_BASE_URL: http://localhost:5173/
          SECURITY_SALT: ci_security_salt_somente_para_testes_0123456789
          JWT_SECRET: ci_jwt_secret_somente_para_testes_0123456789abcdef
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beready_test
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beready_test
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          EMAIL_FROM: noreply@beready.test
          EMAIL_FROM_NAME: BeReady
          REFRESH_COOKIE_SAMESITE: Lax
          REFRESH_COOKIE_SECURE: false
          STRIPE_WEBHOOK_SECRET: whsec_ci_somente_para_testes
          SENTRY_DSN: ""

  coding-standard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Register PHPCS standards
        run: vendor/bin/phpcs --config-set installed_paths vendor/cakephp/cakephp-codesniffer,vendor/slevomat/coding-standard

      - name: Run PHPCS
        run: vendor/bin/phpcs --colors || true
        continue-on-error: true

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_APP_ENV: ${{ secrets.VITE_APP_ENV }}

  # Testes E2E do frontend (Playwright + Chromium). Sem backend: a API é mockada
  # em frontend/e2e/support/api.ts e o build de teste usa só valores fictícios.
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7