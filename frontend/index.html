<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="BeReady - Plataforma de aprendizado de inglês com flashcards, quizzes e IA. Melhore seu inglês de forma contextual e visual."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>BeReady - Aprenda Inglês</title>
        <style>
            /* Indicador exibido enquanto a sessão é reidratada; o Vue o substitui ao montar.
               Roda antes do JS/CSS do app, por isso usa valores literais que ESPELHAM os
               tokens de src/styles/tokens.css (atualize os dois juntos):
               claro  -> --color-bg #f8fafc | --color-primary-soft #eef2ff | --color-primary #4f46e5
               escuro -> --color-bg #0f172a | --color-primary-soft #2b2f63 | --color-primary #818cf8 */
            .boot-loader {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f8fafc;
            }
            .boot-loader__spinner {
                width: 44px;
                height: 44px;
                border: 4px solid #eef2ff;
                border-top-color: #4f46e5;
                border-radius: 50%;
                animation: boot-spin 0.8s linear infinite;
            }
            @keyframes boot-spin {
                to { transform: rotate(360deg); }
            }
            @media (prefers-color-scheme: dark) {
                .boot-loader { background: #0f172a; }
                .boot-loader__spinner { border-color: #2b2f63; border-top-color: #818cf8; }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-loader__spinner { animation-duration: 2.4s; }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="boot-loader" role="status" aria-busy="true" aria-label="BeReady">
                <div class="boot-loader__spinner"></div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
